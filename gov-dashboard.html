<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Osun State Education Analytics</title>
<link rel="icon" href="img/favicon.png" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  body{font-family:Inter,sans-serif;background:#f4f6f4;color:#1a1c1c}
  th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
  th.sortable:hover{background:#e6efe8}
  .bar{height:8px;border-radius:4px;background:#e2e2e2;overflow:hidden}
  .bar>i{display:block;height:100%;background:#006837}
  .bar.warn>i{background:#ba1a1a}
  .bar.mid>i{background:#cba72f}
</style>
</head>
<body>
<header class="bg-[#004d27] text-white">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <img src="img/favicon.png" class="w-10 h-10" alt="" />
      <div>
        <h1 class="text-lg font-bold leading-tight">OSUN STATE EDUCATION ANALYTICS</h1>
        <p class="text-xs text-green-100">State Government / Ministry dashboard</p>
      </div>
    </div>
    <div class="flex items-center gap-3 text-sm">
      <span id="who" class="hidden sm:inline text-green-100"></span>
      <button id="logout" class="bg-white/15 hover:bg-white/25 px-3 py-1.5 rounded-lg">Logout</button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
  <div id="status" class="bg-white border rounded-xl p-6 text-center text-gray-600">Loading state data…</div>

  <div id="app" class="hidden space-y-6">
    <!-- KPI cards -->
    <section class="grid grid-cols-2 lg:grid-cols-5 gap-4" id="kpis"></section>

    <!-- LGA drill-down -->
    <section class="bg-white border rounded-xl">
      <div class="p-4 border-b flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="font-semibold text-lg">Local Government Areas</h2>
          <p class="text-sm text-gray-500">Click an LGA to see its schools and students.</p>
        </div>
        <input id="lga-search" placeholder="Search LGA…" class="border rounded-lg px-3 py-2 text-sm w-48" />
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm" id="lga-table"></table>
      </div>
    </section>

    <!-- Students of selected LGA -->
    <section id="lga-detail" class="hidden bg-white border rounded-xl">
      <div class="p-4 border-b flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="font-semibold text-lg" id="detail-title"></h2>
          <p class="text-sm text-gray-500" id="detail-sub"></p>
        </div>
        <div class="flex flex-wrap gap-2">
          <select id="f-school" class="border rounded-lg px-3 py-2 text-sm"></select>
          <select id="f-class" class="border rounded-lg px-3 py-2 text-sm"></select>
          <input id="f-search" placeholder="Search student…" class="border rounded-lg px-3 py-2 text-sm w-44" />
          <button id="export" class="bg-[#004d27] text-white rounded-lg px-3 py-2 text-sm">Export CSV</button>
          <button id="close-detail" class="border rounded-lg px-3 py-2 text-sm">Close</button>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm" id="student-table"></table>
      </div>
    </section>

    <!-- Analytic views -->
    <section class="grid lg:grid-cols-2 gap-6" id="panels"></section>
  </div>
</main>

<script src="./scripts/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://bjfhmvvupkapplnbrukz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_RxNzh9HL5UPhazJDk6BL9w_aJtZLBAP";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Edit to match the Ministry's own classification of urban LGAs.
const URBAN_LGAS = new Set(["Osogbo","Olorunda","Ede North","Ede South","Ife Central","Ife East","Ilesa East","Ilesa West","Iwo","Ila"]);
const PASS_MARK = 50;          // matches exam.html (PASSED at >= 50%)
const INTERVENTION_BELOW = 40; // school average under this %, with enough attempts
const MIN_ATTEMPTS = 3;

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (n) => (n == null || isNaN(n) ? "–" : Math.round(n) + "%");
const avg = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : null);
const fmt = (n) => Number(n).toLocaleString();

let students = [], results = [], incidents = [];
let PORTAL_ID = null;
let studentRows = [];      // one row per student with performance
let sel = { lga: null, sort: { key: "avg", dir: "desc" } };

async function fetchAll(table, columns) {
  // Supabase returns max 1000 rows per request, so page through.
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await db.from(table).select(columns).range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}

async function init() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) return (location.href = "register.html");
  const { data: me } = await db.from("profiles").select("role,full_name,school_id").eq("id", user.id).maybeSingle();
  if (!me || !["government", "admin"].includes(me.role)) {
    $("status").innerHTML = "<b>Access denied.</b> This page is only for State Government accounts.";
    return;
  }
  if (!me.school_id) {
    $("status").innerHTML = "<b>This account is not linked to a school portal.</b> Ask the system administrator to set its school_id.";
    return;
  }
  // The account must belong to the portal (website address) it is logged in on
  const { data: portal } = await db.from("schools").select("id,school_name,domain").eq("id", me.school_id).maybeSingle();
  const host = location.hostname.replace(/^www\./, "");
  if (portal && portal.domain !== host && !["localhost", "127.0.0.1"].includes(host)) {
    $("status").innerHTML = "<b>Access denied.</b> This account belongs to a different portal.";
    return;
  }
  if (portal) document.title = portal.school_name + " – Education Analytics";
  $("who").textContent = (me.full_name || user.email) + (portal ? " · " + portal.school_name : "");
  PORTAL_ID = me.school_id;
  try {
    [students, results] = await Promise.all([
      fetchAll("profiles", "id,full_name,lga,school_name,class_level,school_type,role,school_id"),
      fetchAll("results", "user_id,score,total,subject,exam_year,created_at,exam_name"),
    ]);
    students = students.filter((p) => p.role === "student" && p.school_id === PORTAL_ID);
    try { incidents = await fetchAll("exam_incidents", "id,kind,user_id,created_at"); } catch { incidents = []; }
    // same rule as the student pages: ignore empty 0-score rows
    const ids = new Set(students.map((s) => s.id));
    results = results.filter((r) => ids.has(r.user_id) && Number(r.score) > 0).map((r) => ({ ...r, p: Number(r.total) > 0 ? (r.score / r.total) * 100 : Number(r.score) }));
    build();
    $("status").classList.add("hidden");
    $("app").classList.remove("hidden");
  } catch (e) {
    console.error(e);
    $("status").innerHTML = "Could not load data: " + esc(e.message);
  }
}

function subjectOf(r) {
  if (r.subject) return r.subject;
  return (r.exam_name || "Unknown").replace(/\b(19|20)\d{2}\b.*$/, "").trim() || "Unknown";
}

function build() {
  const byUser = {};
  results.forEach((r) => (byUser[r.user_id] ||= []).push(r));
  studentRows = students.map((s) => {
    const rs = byUser[s.id] || [];
    return { ...s, lga: s.lga || "Not set", school_name: s.school_name || "Not set", class_level: s.class_level || "Not set",
             exams: rs.length, avg: avg(rs.map((r) => r.p)) };
  });
  const userMap = Object.fromEntries(studentRows.map((s) => [s.id, s]));
  results.forEach((r) => (r.s = userMap[r.user_id]));

  const schools = new Set(studentRows.filter((s) => s.school_name !== "Not set").map((s) => s.lga + "|" + s.school_name));
  const subjects = new Set(results.map(subjectOf));
  const participated = studentRows.filter((s) => s.exams > 0).length;

  $("kpis").innerHTML = [
    ["Schools Registered", fmt(schools.size)],
    ["Students Registered", fmt(studentRows.length)],
    ["Examinations Conducted", fmt(results.length)],
    ["Subjects Assessed", fmt(subjects.size)],
    ["Participation Rate", studentRows.length ? pct((participated / studentRows.length) * 100) : "–"],
  ].map(([l, v]) => `<div class="bg-white border rounded-xl p-4"><p class="text-xs uppercase tracking-wide text-gray-500">${l}</p><p class="text-2xl font-bold text-[#004d27] mt-1">${v}</p></div>`).join("");

  renderLgaTable();
  renderPanels(schools);
}

function group(rows, keyFn) {
  const m = {};
  rows.forEach((r) => (m[keyFn(r)] ||= []).push(r));
  return m;
}

function lgaStats() {
  const g = group(studentRows, (s) => s.lga);
  return Object.entries(g).map(([lga, ss]) => {
    const withExams = ss.filter((s) => s.exams > 0);
    return { lga, students: ss.length, schools: new Set(ss.map((s) => s.school_name)).size,
             exams: ss.reduce((n, s) => n + s.exams, 0), avg: avg(withExams.map((s) => s.avg)),
             part: ss.length ? (withExams.length / ss.length) * 100 : 0 };
  }).sort((a, b) => a.lga.localeCompare(b.lga));
}

function renderLgaTable() {
  const q = $("lga-search").value.toLowerCase();
  const rows = lgaStats().filter((r) => r.lga.toLowerCase().includes(q));
  $("lga-table").innerHTML = `<thead class="bg-gray-50 text-left text-gray-600"><tr>
    <th class="p-3">LGA</th><th class="p-3">Schools</th><th class="p-3">Students</th><th class="p-3">Exams</th><th class="p-3">Avg score</th><th class="p-3">Participation</th></tr></thead>
    <tbody>${rows.map((r) => `<tr class="border-t hover:bg-green-50 cursor-pointer" data-lga="${esc(r.lga)}">
      <td class="p-3 font-medium text-[#004d27]">${esc(r.lga)}</td><td class="p-3">${r.schools}</td><td class="p-3">${fmt(r.students)}</td>
      <td class="p-3">${fmt(r.exams)}</td><td class="p-3">${pct(r.avg)}</td><td class="p-3">${pct(r.part)}</td></tr>`).join("") || `<tr><td class="p-4 text-gray-500" colspan="6">No data yet.</td></tr>`}</tbody>`;
  document.querySelectorAll("#lga-table tr[data-lga]").forEach((tr) => (tr.onclick = () => openLga(tr.dataset.lga)));
}

function openLga(lga) {
  sel.lga = lga;
  const ss = studentRows.filter((s) => s.lga === lga);
  const schools = [...new Set(ss.map((s) => s.school_name))].sort();
  const classes = [...new Set(ss.map((s) => s.class_level))].sort();
  $("f-school").innerHTML = `<option value="">All schools (${schools.length})</option>` + schools.map((s) => `<option>${esc(s)}</option>`).join("");
  $("f-class").innerHTML = `<option value="">All classes</option>` + classes.map((s) => `<option>${esc(s)}</option>`).join("");
  $("f-search").value = "";
  $("detail-title").textContent = lga + " Local Government";
  $("lga-detail").classList.remove("hidden");
  renderStudents();
  $("lga-detail").scrollIntoView({ behavior: "smooth" });
}

const COLS = [
  ["school_name", "School"], ["full_name", "Student"], ["class_level", "Class"], ["exams", "Exams taken"], ["avg", "Performance"],
];

function visibleStudents() {
  const sc = $("f-school").value, cl = $("f-class").value, q = $("f-search").value.toLowerCase();
  const { key, dir } = sel.sort;
  const rows = studentRows.filter((s) => s.lga === sel.lga && (!sc || s.school_name === sc) && (!cl || s.class_level === cl) && (!q || (s.full_name || "").toLowerCase().includes(q)));
  rows.sort((a, b) => {
    const x = a[key], y = b[key];
    // students with no exams always sink to the bottom when sorting by score
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    const c = typeof x === "number" ? x - y : String(x).localeCompare(String(y));
    return dir === "asc" ? c : -c;
  });
  return rows;
}

function renderStudents() {
  const rows = visibleStudents();
  $("detail-sub").textContent = `${rows.length} student${rows.length === 1 ? "" : "s"} shown`;
  const arrow = (k) => (sel.sort.key === k ? (sel.sort.dir === "asc" ? " ▲" : " ▼") : "");
  $("student-table").innerHTML = `<thead class="bg-gray-50 text-left text-gray-600"><tr>${COLS.map(([k, l]) => `<th class="p-3 sortable" data-k="${k}">${l}${arrow(k)}</th>`).join("")}</tr></thead>
    <tbody>${rows.slice(0, 500).map((s) => `<tr class="border-t"><td class="p-3">${esc(s.school_name)}</td><td class="p-3 font-medium">${esc(s.full_name)}</td>
      <td class="p-3">${esc(s.class_level)}</td><td class="p-3">${s.exams}</td>
      <td class="p-3">${s.avg == null ? '<span class="text-gray-400">No exam yet</span>' : `${pct(s.avg)} <span class="ml-2 text-xs px-2 py-0.5 rounded-full ${s.avg >= PASS_MARK ? "bg-green-100 text-green-800" : "bg-red-100 text-red-800"}">${s.avg >= PASS_MARK ? "Pass" : "Fail"}</span>`}</td></tr>`).join("") || `<tr><td class="p-4 text-gray-500" colspan="5">No students match.</td></tr>`}</tbody>`
    + (rows.length > 500 ? "" : "");
  if (rows.length > 500) $("detail-sub").textContent += " (first 500 displayed – narrow with the filters or export CSV for all)";
  document.querySelectorAll("#student-table th.sortable").forEach((th) => (th.onclick = () => {
    const k = th.dataset.k;
    sel.sort = { key: k, dir: sel.sort.key === k && sel.sort.dir === "asc" ? "desc" : "asc" };
    renderStudents();
  }));
}

function exportCsv() {
  const rows = visibleStudents();
  const csv = [["LGA", "School", "Student", "Class", "Exams", "Average %"], ...rows.map((s) => [s.lga, s.school_name, s.full_name, s.class_level, s.exams, s.avg == null ? "" : Math.round(s.avg)])]
    .map((r) => r.map((v) => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = `${sel.lga}-students.csv`;
  a.click();
}

function barRow(label, value, extra = "") {
  const cls = value == null ? "" : value < INTERVENTION_BELOW ? "warn" : value < PASS_MARK ? "mid" : "";
  return `<div class="py-1.5"><div class="flex justify-between text-sm"><span>${esc(label)}</span><span class="text-gray-600">${pct(value)} ${extra}</span></div><div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(100, value || 0))}%"></i></div></div>`;
}

function panel(title, body, note = "") {
  return `<div class="bg-white border rounded-xl p-4"><h3 class="font-semibold mb-2">${title}</h3>${body || '<p class="text-sm text-gray-500">No data yet.</p>'}${note ? `<p class="text-xs text-gray-400 mt-2">${note}</p>` : ""}</div>`;
}

function renderPanels() {
  const avgBy = (rows, keyFn) => Object.entries(group(rows, keyFn)).map(([k, rs]) => [k, avg(rs.map((r) => r.p)), rs.length]).sort((a, b) => b[1] - a[1]);
  const withStudent = results.filter((r) => r.s);
  const list = (arr, n = 10) => arr.slice(0, n).map(([k, v, c]) => barRow(k, v, `· ${fmt(c)} exams`)).join("");

  const bySubject = avgBy(results, subjectOf);
  const byClass = avgBy(withStudent, (r) => r.s.class_level);
  const byLga = avgBy(withStudent, (r) => r.s.lga);
  const byType = avgBy(withStudent, (r) => (r.s.school_type === "private" ? "Private schools" : "Public schools"));
  const byArea = avgBy(withStudent, (r) => (URBAN_LGAS.has(r.s.lga) ? "Urban LGAs" : "Rural LGAs"));
  const byYear = Object.entries(group(results, (r) => new Date(r.created_at).getFullYear())).sort().map(([y, rs]) => [y, avg(rs.map((r) => r.p)), rs.length]);

  // participation by LGA
  const part = lgaStats().sort((a, b) => b.part - a.part).map((r) => [r.lga, r.part, r.students]);

  // schools requiring intervention
  const sg = group(withStudent, (r) => r.s.lga + " — " + r.s.school_name);
  const weak = Object.entries(sg).map(([k, rs]) => [k, avg(rs.map((r) => r.p)), rs.length]).filter(([, a, c]) => c >= MIN_ATTEMPTS && a < INTERVENTION_BELOW).sort((a, b) => a[1] - b[1]);

  const inc = Object.entries(group(incidents, (i) => i.kind)).sort((a, b) => b[1].length - a[1].length);

  $("panels").innerHTML = [
    panel("Performance by Local Government Area", list(byLga, 30)),
    panel("Performance by subject", list(bySubject, 30)),
    panel("Performance by class", list(byClass)),
    panel("Public vs private schools", list(byType), "Based on the school type chosen at registration."),
    panel("Urban vs rural schools", list(byArea), "Urban LGA list is set in URBAN_LGAS at the top of this file."),
    panel("Year-to-year performance trend", byYear.map(([y, v, c]) => barRow(y, v, `· ${fmt(c)} exams`)).join("")),
    panel("Participation rate by LGA", part.map(([l, v, c]) => barRow(l, v, `· ${fmt(c)} students`)).join(""), "% of registered students who have taken at least one exam."),
    panel("Examination irregularities", inc.map(([k, rs]) => `<div class="flex justify-between text-sm py-1"><span>${esc(k.replace(/_/g, " "))}</span><b>${fmt(rs.length)}</b></div>`).join(""), "Shows data once the exam page writes to the exam_incidents table."),
    `<div class="lg:col-span-2">${panel(`Schools requiring intervention (average below ${INTERVENTION_BELOW}%, at least ${MIN_ATTEMPTS} exams)`, weak.map(([k, v, c]) => barRow(k, v, `· ${c} exams`)).join(""))}</div>`,
  ].join("");
}

$("lga-search").oninput = renderLgaTable;
["f-school", "f-class"].forEach((id) => ($(id).onchange = renderStudents));
$("f-search").oninput = renderStudents;
$("export").onclick = exportCsv;
$("close-detail").onclick = () => $("lga-detail").classList.add("hidden");
$("logout").onclick = async () => { await db.auth.signOut(); localStorage.removeItem("supabase_access_token"); location.href = "register.html"; };
init();
</script>
</body>
</html>
